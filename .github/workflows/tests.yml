name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '8.*', testbench: '6.*', php: '7.4' }
          - { laravel: '8.*', testbench: '6.*', php: '8.0' }
          - { laravel: '9.*', testbench: '7.*', php: '8.1' }
          - { laravel: '10.*', testbench: '8.*', php: '8.2' }
          - { laravel: '11.*', testbench: '9.*', php: '8.3' }
          - { laravel: '12.*', testbench: '10.*', php: '8.4' }
          - { laravel: '12.*', testbench: '10.*', php: '8.5' }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Install Laravel ${{ matrix.laravel }}
        # Laravel 8-11 are past security support, and Composer 2.9+ refuses to
        # install releases with open advisories. Allow them here, for tests only.
        run: |
          composer config audit.block-insecure false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Check PSR-4 (issue #1)
        run: composer dump-autoload --optimize --strict-psr

      - name: Run tests
        run: |
          php -v | head -1
          composer dump-autoload
          vendor/bin/phpunit
